name: Weekly Yoga Schedule Check

on:
  schedule:
    # Runs at 11:00 UTC (6:00 AM CDT) every Monday
    # - cron: '0 11 * * 1'
    - cron: '0 15 * * 5'
  workflow_dispatch: # Allows manual trigger via GitHub UI anytime

jobs:
  check-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Run schedule check script
        env:
          SENDER_EMAIL: "mattkainlewandowski@gmail.com"
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: python check_schedule.py